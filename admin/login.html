<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080a12">
  <title>Вход — панель управления</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syncopate:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
  <div class="bg" aria-hidden="true"><div class="bg__glow"></div><div class="bg__grid"></div></div>

  <main class="login">
    <svg class="login__mark" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
      <defs><linearGradient id="lm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F9BFF"/><stop offset="1" stop-color="#AA7CFF"/></linearGradient></defs>
      <path d="M20 1 C22 13 27 18 39 20 C27 22 22 27 20 39 C18 27 13 22 1 20 C13 18 18 13 20 1Z" fill="url(#lm)"/>
    </svg>
    <p class="eyebrow mono">Панель управления</p>
    <h1 class="login__title">Вход</h1>
    <form id="form" class="login__form" autocomplete="on" novalidate>
      <label class="field">
        <span class="field__label">Пароль администратора</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <p id="msg" class="login__msg" role="alert" hidden></p>
      <button class="btn btn--primary" id="submit" type="submit"><span>Войти</span></button>
    </form>
    <a class="login__back mono" href="/">← На сайт</a>
  </main>

  <script src="login.js"></script>
</body>
</html>
